<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snow Origin Research</title>
  <meta name="description" content="雪梦未来（Snow Origin）研究项目主页">
  <link rel="icon" href="assets/brand/logo-round.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .hero { padding: 48px 0 24px; }
    .hero h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 8px; }
    .hero p { color: var(--muted); margin: 0; max-width: 640px; }
    .projects { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 16px; }
    .project { display: block; padding: 20px 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); text-decoration: none; transition: border-color .15s; }
    .project:hover { border-color: var(--brand); }
    .project b { display: block; font-size: 20px; }
    .project span { display: block; margin-top: 4px; color: var(--muted); font-size: 15px; }
    .project small { display: block; margin-top: 10px; color: var(--brand); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="https://snoworigin.tech"><img src="assets/brand/logo-horizontal.png" alt="雪梦未来 Snow Origin"></a>
    </header>

    <main>
      <section class="hero">
        <h1>Snow Origin Research</h1>
        <p>雪梦未来研究项目：肌电（EMG）解码、第一视角感知与具身智能数据。</p>
      </section>

      <ul class="projects">
        <li><a class="project" href="emgforce/"><b>EmgForce-4D</b><span>肌电触觉感知基座模型：佩戴 Ego 相机与神经腕带，裸手输出 4D／3D／1D 力感知</span><small>保密预览 · 凭访问码查看 →</small></a></li>
      </ul>
    </main>

    <footer class="site-footer">
      <div>© Snow Origin · <a href="https://snoworigin.tech">snoworigin.tech</a></div>
      <div class="qr">
        <img src="assets/brand/wechat-qrcode.jpg" alt="雪梦未来公众号二维码">
        <span>微信公众号</span>
      </div>
    </footer>
  </div>
</body>
</html>
