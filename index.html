<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snow Origin Research</title>
  <meta name="description" content="雪梦未来（Snow Origin）研究项目主页">
  <link rel="icon" href="assets/brand/logo-round.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .hero { padding: 48px 0 24px; }
    .hero h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 8px; }
    .hero p { color: var(--muted); margin: 0; max-width: 640px; }
    .projects { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 16px; }
    .empty { padding: 24px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); background: var(--surface); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="https://snoworigin.tech"><img src="assets/brand/logo-horizontal.png" alt="雪梦未来 Snow Origin"></a>
    </header>

    <main>
      <section class="hero">
        <h1>Snow Origin Research</h1>
        <p>雪梦未来研究项目：肌电（EMG）解码、第一视角感知与具身智能数据。</p>
      </section>

      <ul class="projects">
        <li class="empty">项目页面整理中。</li>
      </ul>
    </main>

    <footer class="site-footer">
      <div>© Snow Origin · <a href="https://snoworigin.tech">snoworigin.tech</a></div>
      <div class="qr">
        <img src="assets/brand/wechat-qrcode.jpg" alt="雪梦未来公众号二维码">
        <span>微信公众号</span>
      </div>
    </footer>
  </div>
</body>
</html>
